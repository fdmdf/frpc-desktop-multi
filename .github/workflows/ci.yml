name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FRP_VERSION: v0.71.1

jobs:
  # ---------------------------------------------------------------- 发布流水线自检
  # 目的：把「改了 release.yml 却忘了同步产物清单 / workflow 名字里混进 ": " /
  # .iss 丢了 UTF-8 BOM」这几类只在发版时才炸的问题，提前到 PR 阶段。
  manifest:
    name: Release manifest consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release artifact manifest
        run: |
          set -euo pipefail
          # runner 自带 PyYAML；万一镜像变了先补装，装不上就直接失败而不是静默跳过
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user pyyaml
          python3 -c 'import yaml' || {
            echo "::error::python3 无法 import yaml，产物清单自检无法进行"
            exit 1
          }
          python3 scripts/ci/check-release-manifest.py

      - name: Lint workflow YAML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml

          # name: 的值里出现 ": " 会让 YAML 解析失败（整个 workflow 直接挂掉）。
          # 加了引号就能活（现有 "Unit tests (shared: jvm + android)" 就是例子），
          # 所以这里以解析结果为准，再把带 ": " 的名字列出来提醒保持引号。
          offenders = []
          for p in (".github/workflows/ci.yml", ".github/workflows/release.yml"):
              with open(p, encoding="utf-8") as f:
                  doc = yaml.safe_load(f)
              assert isinstance(doc, dict) and doc.get("jobs"), p
              for jn, job in doc["jobs"].items():
                  names = [("job", jn, job.get("name"))]
                  names += [("step", jn, st.get("name")) for st in job.get("steps") or []]
                  for kind, where, name in names:
                      if name and ": " in name:
                          offenders.append(f"{p} jobs.{where} {kind} name {name!r}")
              print("ok:", p, "->", len(doc["jobs"]), "jobs")

          if offenders:
              print()
              print("::warning::以下名字含 \": \"，在 YAML 里必须加引号，否则整个 workflow 会解析失败：")
              for o in offenders:
                  print("::warning::  -", o)
          PY

      - name: Check Inno Setup script encoding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p = "packaging/windows/Frpc-Android-Multi.iss"
          with open(p, "rb") as f:
              head = f.read(3)
          # 无 BOM 时 ISCC 在 en-US 的 runner 上按 ANSI 读，中文会整片乱码
          assert head == b"\xef\xbb\xbf", \
              f"{p} 缺少 UTF-8 BOM（首 3 字节为 {head!r}），安装向导中文会乱码"
          print("ok:", p, "UTF-8 with BOM")
          PY

  # ---------------------------------------------------------------- 共享层单测
  shared:
    name: Shared model & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: "Unit tests (shared: jvm + android)"
        run: ./gradlew --no-daemon :shared:jvmTest :shared:testDebugUnitTest --console=plain
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/
          retention-days: 7

  # ---------------------------------------------------------------- Android
  android:
    name: Android (assemble + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          # 仓库里没有 go.mod（frp 源码是构建期下载的），setup-go 的依赖缓存用不上，
          # 下面改用 actions/cache 按 FRP_VERSION 显式缓存 GOCACHE / GOMODCACHE
          cache: false

      - name: Resolve Go cache paths
        id: gopaths
        shell: bash
        run: |
          set -euo pipefail
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ env.FRP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-

      # frp 源码按版本只下载一份，多个 job 复用（脚本命中缓存后不再走网络）
      - name: Cache frp source
        uses: actions/cache@v4
        with:
          path: .build/frpc-engine/src
          key: frp-src-${{ env.FRP_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build frpc engine (android/arm64)
        env:
          SKIP_X86_64: '1'
        run: bash scripts/build-frpc.sh android

      - name: Verify engine is a valid AArch64 ELF
        run: |
          python3 - <<'PY'
          data = open('androidApp/src/main/jniLibs/arm64-v8a/libfrpc.so', 'rb').read(20)
          assert data[:4] == b'\x7fELF', 'not an ELF binary'
          assert data[4] == 2, 'not ELF64'
          assert int.from_bytes(data[18:20], 'little') == 0xB7, 'not AArch64'
          print('OK: ELF64 AArch64')
          PY

      - name: Unit tests (app)
        run: ./gradlew --no-daemon :androidApp:testDebugUnitTest --console=plain

      - name: Lint (non-blocking)
        continue-on-error: true
        run: ./gradlew --no-daemon :androidApp:lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frpc-Android-Multi-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ---------------------------------------------------------------- 桌面端（Windows）
  desktop-windows:
    name: Desktop (Windows compile + smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          # 仓库里没有 go.mod（frp 源码是构建期下载的），setup-go 的依赖缓存用不上，
          # 下面改用 actions/cache 按 FRP_VERSION 显式缓存 GOCACHE / GOMODCACHE
          cache: false

      - name: Resolve Go cache paths
        id: gopaths
        shell: bash
        run: |
          set -euo pipefail
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ env.FRP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-

      # frp 源码按版本只下载一份，多个 job 复用（脚本命中缓存后不再走网络）
      - name: Cache frp source
        uses: actions/cache@v4
        with:
          path: .build/frpc-engine/src
          key: frp-src-${{ env.FRP_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build frpc engine
        shell: bash
        run: bash scripts/build-frpc.sh desktop

      - name: Compile desktop app
        shell: bash
        run: ./gradlew --no-daemon :desktopApp:compileKotlin --console=plain

      - name: Smoke test (engine + local frps)
        shell: bash
        run: |
          set -euo pipefail
          SRC=".build/frpc-engine/src/github.com/fatedier/frp@${FRP_VERSION}"
          mkdir -p "$SRC/web/frps/dist" e2e
          echo placeholder > "$SRC/web/frps/dist/index.html"
          ( cd "$SRC" && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -tags frps -o "$GITHUB_WORKSPACE/e2e/frps.exe" ./cmd/frps )

          # 本地起一个会回声的后端，验证 frpc 真能把流量转过去
          python - <<'PY' &
          import socket, threading
          s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(('127.0.0.1', 18001)); s.listen(8)
          def h(c):
              while True:
                  d = c.recv(4096)
                  if not d: break
                  c.sendall(d)
              c.close()
          while True:
              c, _ = s.accept(); threading.Thread(target=h, args=(c,), daemon=True).start()
          PY
          BACKEND_PID=$!

          cat > e2e/frps.toml <<'EOF'
          bindPort = 17000
          auth.method = "token"
          auth.token = "smoketoken"
          allowPorts = [{ start = 17000, end = 17600 }]
          EOF

          cat > e2e/frpc.toml <<'EOF'
          serverAddr = "127.0.0.1"
          serverPort = 17000
          loginFailExit = true
          auth.method = "token"
          auth.token = "smoketoken"
          webServer.addr = "127.0.0.1"
          webServer.port = 17400
          webServer.user = "admin"
          webServer.password = "admin"
          [[proxies]]
          name = "smoke-tcp"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 18001
          remotePort = 17101
          EOF

          ./e2e/frps.exe -c e2e/frps.toml > e2e/frps.log 2>&1 &
          FRPS_PID=$!
          sleep 4

          ./gradlew --no-daemon :desktopApp:run --console=plain --args="--smoke $(cygpath -m "$PWD/e2e/frpc.toml")" | tee e2e/smoke.log

          grep -q "admin enabled=true" e2e/smoke.log
          grep -q "reachable=true" e2e/smoke.log
          grep -q "forward :17101" e2e/smoke.log
          grep -q "after-stop phase=IDLE" e2e/smoke.log

          kill $FRPS_PID $BACKEND_PID 2>/dev/null || true

  # ---------------------------------------------------------------- 八协议端到端
  protocols:
    name: Protocols e2e (8 types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          # 仓库里没有 go.mod（frp 源码是构建期下载的），setup-go 的依赖缓存用不上，
          # 下面改用 actions/cache 按 FRP_VERSION 显式缓存 GOCACHE / GOMODCACHE
          cache: false

      - name: Resolve Go cache paths
        id: gopaths
        shell: bash
        run: |
          set -euo pipefail
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ env.FRP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-

      # frp 源码按版本只下载一份，多个 job 复用（脚本命中缓存后不再走网络）
      - name: Cache frp source
        uses: actions/cache@v4
        with:
          path: .build/frpc-engine/src
          key: frp-src-${{ env.FRP_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build frpc engine
        run: bash scripts/build-frpc.sh desktop

      - name: Run protocol e2e (tcp/udp/http/https/stcp/xtcp/tcpmux/sudp)
        run: |
          # 默认 shell 没有 pipefail，脚本失败会被 tee 的 0 掩盖，这里显式打开
          set -euo pipefail
          # 导出 TOML 借道 :desktopApp:run，runner 无 DISPLAY，套一层 xvfb 最稳
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a bash scripts/e2e/e2e-protocols.sh 2>&1 | tee e2e.log
          else
            bash scripts/e2e/e2e-protocols.sh 2>&1 | tee e2e.log
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-e2e-logs
          path: |
            e2e.log
            .build/e2e/*.log
            .build/e2e/*.toml
          retention-days: 7
