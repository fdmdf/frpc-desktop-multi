name: Tauri CI

on:
  push:
    branches: [main, dev, tauri-rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FRP_VERSION: v0.71.1

jobs:
  # ---------------------------------------------------------------- 核心层（对拍测试）
  core:
    name: frpc-core (fmt + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - name: Format check
        run: cargo fmt --manifest-path tauri/Cargo.toml -- --check
      - name: Test frpc-core
        run: cargo test --manifest-path tauri/Cargo.toml -p frpc-core

  # ---------------------------------------------------------------- 桌面三平台编译 + 打包
  desktop:
    name: Tauri desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            targets: windows
          - os: ubuntu-24.04
            name: linux-x64
            targets: linux
          - os: macos-14
            name: macos-arm64
            targets: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri/app/ui/package-lock.json

      # Tauri v2 Linux 依赖（Ubuntu 24.04 用 webkit2gtk-4.1）
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential

      # 构建 frpc 引擎并放入 Tauri 资源目录（随包分发，与 Kotlin 版同源同版本）
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Build frpc engine
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          bash scripts/build-frpc.sh desktop
          mkdir -p tauri/app/src-tauri/resources/engine
          cp desktopApp/engine/frpc* tauri/app/src-tauri/resources/engine/
          cp desktopApp/engine/VERSION tauri/app/src-tauri/resources/engine/
          ls -la tauri/app/src-tauri/resources/engine/

      - name: Build UI (vue-tsc + vite)
        run: npm --prefix tauri/app/ui ci --no-audit --no-fund && npm --prefix tauri/app/ui run build

      - name: Core tests
        run: cargo test --manifest-path tauri/Cargo.toml -p frpc-core

      # tauri build 内部会先执行 beforeBuildCommand（npm --prefix ui run build），重复执行无害
      - name: Tauri build (bundle)
        working-directory: tauri/app
        run: ui/node_modules/.bin/tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.name }}
          path: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/deb/*.deb
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14
