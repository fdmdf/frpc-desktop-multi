name: Tauri CI

on:
  push:
    branches: [main, dev, tauri-rewrite]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FRP_VERSION: v0.71.1

# 全部 run 统一用 bash——Windows 默认是 pwsh，bash 语法（set -o pipefail 等）会直接报错
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------- 核心层（对拍测试）
  core:
    name: frpc-core (fmt + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - name: Format check
        run: |
          cargo fmt --all --manifest-path tauri/Cargo.toml -- --check 2>&1 | tee /tmp/fmt.log || CODE=$?
          if [ "${CODE:-0}" -ne 0 ]; then
            tail -n 22 /tmp/fmt.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "${CODE:-1}"
          fi
      - name: Test frpc-core
        run: cargo test --manifest-path tauri/Cargo.toml -p frpc-core

  # ---------------------------------------------------------------- 桌面三平台编译 + 打包
  desktop:
    name: Tauri desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            targets: windows
          - os: ubuntu-24.04
            name: linux-x64
            targets: linux
          - os: macos-14
            name: macos-arm64
            targets: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri/app/ui/package-lock.json

      # Tauri v2 Linux 依赖（Ubuntu 24.04 用 webkit2gtk-4.1）
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential

      # 构建 frpc 引擎并放入 Tauri 资源目录（随包分发，与 Kotlin 版同源同版本）
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Build frpc engine
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -o pipefail
          bash -x scripts/build-frpc.sh desktop 2>&1 | tee /tmp/eng.log || CODE=$?
          if [ "${CODE:-0}" -ne 0 ]; then
            tail -n 10 /tmp/eng.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "${CODE:-1}"
          fi
          # build-frpc.sh 现在直接输出到 tauri/app/src-tauri/resources/engine，这里只校验
          ls -la tauri/app/src-tauri/resources/engine/ \
            || { echo "::error::resources/engine 未生成"; exit 1; }
          test -f tauri/app/src-tauri/resources/engine/VERSION \
            || { echo "::error::resources/engine/VERSION 缺失"; exit 1; }

      - name: Build UI (vue-tsc + vite)
        run: npm --prefix tauri/app/ui ci --no-audit --no-fund && npm --prefix tauri/app/ui run build

      - name: Core tests
        run: cargo test --manifest-path tauri/Cargo.toml -p frpc-core

      # tauri build 内部会先执行 beforeBuildCommand（npm --prefix ui run build），重复执行无害
      - name: Tauri build (bundle)
        working-directory: tauri/app
        run: ui/node_modules/.bin/tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.name }}
          path: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/deb/*.deb
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      # tag push（如 v1.4.0）时把安装包直接挂到 GitHub Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/deb/*.deb
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true

  # ---------------------------------------------------------------- Android APK（tag / 手动）
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # gradle universal flavor 会为 4 个 ABI 逐个触发 cargo 构建
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri/app/ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      # runner 自带 Android SDK；补装固定版本 NDK（与本地构建一致）
      - name: Install NDK 27.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
          && echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build frpc engine (android arm64)
        run: bash scripts/build-frpc.sh android

      # tauri CLI 在 ui/node_modules，必须先装依赖再 init
      - name: Build UI (vue-tsc + vite)
        run: npm --prefix tauri/app/ui ci --no-audit --no-fund && npm --prefix tauri/app/ui run build

      # init + gradle 补丁（镜像 / 压缩打包 / 引擎源目录 / BuildTask 守卫）
      - name: Init Tauri Android project
        run: bash scripts/tauri-android-setup.sh

      # Linux 上符号链接可用，CLI 全流程直通
      - name: Tauri android build (apk)
        working-directory: tauri/app
        run: |
          set -o pipefail
          ui/node_modules/.bin/tauri android build --apk --target aarch64 2>&1 | tee /tmp/apk.log || CODE=$?
          if [ "${CODE:-0}" -ne 0 ]; then
            tail -n 10 /tmp/apk.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "${CODE:-1}"
          fi

      - name: Sign APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          # 文件名跟着 tag 走（v1.4.1 -> frpc-desktop-multi-1.4.1-arm64.apk），
          # 手动触发时退回 tauri.conf.json 的 version
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" != "$GITHUB_REF_NAME" ] || VER="$(python -c 'import json;print(json.load(open("tauri/app/src-tauri/tauri.conf.json"))["version"])')"
          APK="frpc-desktop-multi-${VER}-arm64.apk"
          echo "apk name: $APK"
          # CLI 打的是 universal flavor（产物目录随 flavor 变化），这里按实际产物定位，
          # 不再写死 arm64 目录
          UNSIGNED="$(find tauri/app/src-tauri/gen/android/app/build/outputs/apk \
            -name '*-release-unsigned.apk' -print -quit)"
          echo "unsigned apk: $UNSIGNED"
          test -f "$UNSIGNED"

          # 签名密钥必须**跨构建固定**，否则每个版本签名不同，覆盖安装报
          # INSTALL_FAILED_UPDATE_INCOMPATIBLE。历史实现每次 keytool -genkeypair
          # 现生成一把临时的，就是「每次安装都提示签名不对」的根因。
          #
          # 唯一来源：仓库内的固定密钥。不接受 secrets、不接受环境变量、
          # 不自动生成 —— 文件缺失或指纹不符一律**直接失败**，宁可打不出包，
          # 也不能悄悄发一个签名不同的 APK 出去。
          KS="tauri/android-signing/release.keystore"
          KS_PASS="frpc-desktop-multi"
          KEY_PASS="frpc-desktop-multi"
          KEY_ALIAS="frpc"
          # 仓库密钥的证书指纹（keytool -list -v 里那一行），换密钥时必须同步改这里
          EXPECTED_SHA256="E2:D0:7C:A1:12:B8:BF:D8:F3:09:AA:AD:72:B4:1A:E2:8A:6B:FA:2B:42:D1:4E:9F:0C:07:86:92:91:5E:4A:02"

          if [ ! -f "$KS" ]; then
            echo "::error file=$KS::签名密钥缺失。安卓签名只认 $KS，仓库里没有这个文件就打不出可覆盖升级的包。见 tauri/android-signing/README.md"
            exit 1
          fi
          if command -v keytool >/dev/null 2>&1; then KT=keytool; else KT="$JAVA_HOME/bin/keytool"; fi
          # `|| true`：密码/alias 不对时 keytool 退出码非 0，配合 pipefail + set -e
          # 会直接中断脚本，下面的友好提示就没机会打印了
          REAL_SHA256="$("$KT" -list -v -keystore "$KS" \
            -alias "$KEY_ALIAS" -storepass "$KS_PASS" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 || true)"
          if [ -z "$REAL_SHA256" ]; then
            echo "::error file=$KS::读不出证书指纹。密钥文件损坏，或 alias/密码与 tauri/android-signing/README.md 不一致"
            exit 1
          fi
          if [ "$REAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error file=$KS::签名密钥指纹不符，拒绝出包。"
            echo "  期望: $EXPECTED_SHA256"
            echo "  实际: $REAL_SHA256"
            echo "  覆盖安装会报「签名不一致」。若确属更换密钥，请同步更新本步骤的 EXPECTED_SHA256。"
            exit 1
          fi
          echo "signing key: $KS ($REAL_SHA256)"

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"

          # 出包后再核对一次：产物证书必须就是仓库密钥那把，否则不出包
          SIGNED_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -n 1)"
          if [ "$(printf '%s' "$SIGNED_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')" != \
               "$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')" ]; then
            echo "::error::签名后的 APK 指纹与仓库密钥不一致（实际 ${SIGNED_SHA256:-<空>}），拒绝上传"
            exit 1
          fi
          echo "signed apk cert: $SIGNED_SHA256"

          # 把证书指纹写进 job summary：出问题时一眼看出签名有没有被换掉
          {
            echo "### APK 签名证书"
            echo '```'
            grep -E "Signer #1 certificate (DN|SHA-256)" "$RUNNER_TEMP/certs.txt" || true
            echo '```'
            echo "签名密钥：\`$KS\`（仓库固定，无 secrets 回退）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frpc-desktop-multi-*-arm64.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frpc-desktop-multi-*-arm64.apk
