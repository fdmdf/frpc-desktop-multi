name: Tauri CI

on:
  push:
    branches: [main, dev, tauri-rewrite]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FRP_VERSION: v0.71.1

jobs:
  # ---------------------------------------------------------------- 核心层（对拍测试）
  core:
    name: frpc-core (fmt + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - name: Format check
        run: |
          cargo fmt --all --manifest-path tauri/Cargo.toml -- --check 2>&1 | tee /tmp/fmt.log || CODE=$?
          if [ "${CODE:-0}" -ne 0 ]; then
            tail -n 22 /tmp/fmt.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "${CODE:-1}"
          fi
      - name: Test frpc-core
        run: cargo test --manifest-path tauri/Cargo.toml -p frpc-core

  # ---------------------------------------------------------------- 桌面三平台编译 + 打包
  desktop:
    name: Tauri desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            targets: windows
          - os: ubuntu-24.04
            name: linux-x64
            targets: linux
          - os: macos-14
            name: macos-arm64
            targets: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri/app/ui/package-lock.json

      # Tauri v2 Linux 依赖（Ubuntu 24.04 用 webkit2gtk-4.1）
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential

      # 构建 frpc 引擎并放入 Tauri 资源目录（随包分发，与 Kotlin 版同源同版本）
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Build frpc engine
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -o pipefail
          bash -x scripts/build-frpc.sh desktop 2>&1 | tee /tmp/eng.log || CODE=$?
          if [ "${CODE:-0}" -ne 0 ]; then
            tail -n 10 /tmp/eng.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "${CODE:-1}"
          fi
          mkdir -p tauri/app/src-tauri/resources/engine || { echo "::error::mkdir resources/engine failed"; exit 1; }
          cp desktopApp/engine/frpc* tauri/app/src-tauri/resources/engine/ || { echo "::error::cp frpc* failed"; ls -la desktopApp/engine >&2 || true; exit 1; }
          cp desktopApp/engine/VERSION tauri/app/src-tauri/resources/engine/ || { echo "::error::cp VERSION failed"; exit 1; }
          ls -la tauri/app/src-tauri/resources/engine/

      - name: Build UI (vue-tsc + vite)
        run: npm --prefix tauri/app/ui ci --no-audit --no-fund && npm --prefix tauri/app/ui run build

      - name: Core tests
        run: cargo test --manifest-path tauri/Cargo.toml -p frpc-core

      # tauri build 内部会先执行 beforeBuildCommand（npm --prefix ui run build），重复执行无害
      - name: Tauri build (bundle)
        working-directory: tauri/app
        run: ui/node_modules/.bin/tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.name }}
          path: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/deb/*.deb
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      # tag push（如 v1.4.0）时把安装包直接挂到 GitHub Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/deb/*.deb
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true

  # ---------------------------------------------------------------- Android APK（tag / 手动）
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri/app/ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      # runner 自带 Android SDK；补装固定版本 NDK（与本地构建一致）
      - name: Install NDK 27.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
          && echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build frpc engine (android arm64)
        run: bash scripts/build-frpc.sh android

      # tauri CLI 在 ui/node_modules，必须先装依赖再 init
      - name: Build UI (vue-tsc + vite)
        run: npm --prefix tauri/app/ui ci --no-audit --no-fund && npm --prefix tauri/app/ui run build

      # init + gradle 补丁（镜像 / 压缩打包 / 引擎源目录 / BuildTask 守卫）
      - name: Init Tauri Android project
        run: bash scripts/tauri-android-setup.sh

      # Linux 上符号链接可用，CLI 全流程直通
      - name: Tauri android build (apk)
        working-directory: tauri/app
        run: |
          set -o pipefail
          ui/node_modules/.bin/tauri android build --apk --target aarch64 2>&1 | tee /tmp/apk.log || CODE=$?
          if [ "${CODE:-0}" -ne 0 ]; then
            tail -n 10 /tmp/apk.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "${CODE:-1}"
          fi

      - name: Sign APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED="tauri/app/src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk"
          test -f "$UNSIGNED"
          KS="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -v -keystore "$KS" -alias frpc -keyalg RSA -keysize 2048 \
            -validity 10950 -storepass frpc-desktop-multi -keypass frpc-desktop-multi \
            -dname "CN=frpc-desktop-multi, O=fdmdf, C=CN"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:frpc-desktop-multi \
            --key-pass pass:frpc-desktop-multi --ks-key-alias frpc \
            --out "frpc-desktop-multi-1.4.0-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "frpc-desktop-multi-1.4.0-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frpc-desktop-multi-1.4.0-arm64.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frpc-desktop-multi-1.4.0-arm64.apk
