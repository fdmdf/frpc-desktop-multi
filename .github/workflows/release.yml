name: Release

# 触发方式：
#   1) 推送 v* tag            —— 正式发版，版本号取自 tag
#   2) 手动 workflow_dispatch —— 补发/重发，版本号可填，留空用 androidApp 的 versionName
#
# 产物命名规范（PRODUCT-版本-系统-架构[-变体].扩展名）：
#   frpc-desktop-multi-1.0.0-windows-x64-setup.exe    Windows 安装程序（自带 JRE，开始菜单快捷方式）
#   frpc-desktop-multi-1.0.0-windows-x64.zip          Windows 便携版（解压即用）
#   frpc-desktop-multi-1.0.0-linux-x64.tar.gz         Linux 通用包（解压运行 bin/frpc-desktop-multi）
#   frpc-desktop-multi-1.0.0-linux-x64.deb            Debian / Ubuntu
#   frpc-desktop-multi-1.0.0-linux-x64.AppImage       AppImage（可选，失败不阻塞发版）
#   frpc-desktop-multi-1.0.0-macos-arm64.dmg          macOS Apple Silicon
#   frpc-desktop-multi-1.0.0-macos-arm64.tar.gz       同上，.app 压缩包
#   frpc-desktop-multi-1.0.0-macos-x64.dmg            macOS Intel
#   frpc-desktop-multi-1.0.0-macos-x64.tar.gz         同上，.app 压缩包
#   frpc-desktop-multi-1.0.0-android-arm64.apk        Android（签名密钥失效时才退化成 -unsigned）
#   frpc-engine-VERSION.txt                           内置 frpc 引擎版本留档

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（x.y.z）。留空则读取 androidApp 的 versionName'
        required: false
      skip_version_check:
        description: '跳过「发布版本 == 构建文件版本」一致性校验（紧急发版用）'
        type: boolean
        default: false
      allow_unsigned_apk:
        description: '强制放行未签名 APK（签名密钥失效等紧急情况；产物装不上手机）'
        type: boolean
        default: false

permissions:
  contents: write

# 同一 tag 的重复触发排队执行，避免两个 workflow 同时覆盖同一批 Release 产物
concurrency:
  group: release-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

env:
  # 产品名 = 仓库名 = jpackage packageName。改这里必须同步 desktopApp/build.gradle.kts 的 packageName，
  # 否则 desktop job 会在 $BIN/app 下找不到同名目录而报「缺少产物」
  PRODUCT: frpc-desktop-multi
  FRP_VERSION: v0.71.1

jobs:
  # ================================================================ 版本解析与 tag 关联
  # 所有下游 job 共用这一个版本，避免「APK 叫 1.0.0、dmg 叫 1.0.1」这类错位
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_tag_push: ${{ steps.resolve.outputs.is_tag_push }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          SKIP_CHECK: ${{ github.event.inputs.skip_version_check }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
            IS_TAG=true
          else
            V="${INPUT_VERSION:-}"
            IS_TAG=false
            if [ -z "$V" ]; then
              V="$(grep -oE 'versionName = "[0-9][0-9.]*"' androidApp/build.gradle.kts | head -1 | sed 's/.*"\([^"]*\)"/\1/')"
              echo "::notice::未填写版本号，回退到 androidApp versionName = $V"
            fi
          fi

          # 必须是 x.y.z。jpackage 的 packageVersion 只接受 MAJOR[.MINOR[.BUILD]]，
          # 带 -rc1 / -beta 之类后缀会让 Windows 打包直接失败，所以在这里就卡住
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号「$V」不合法，必须是 数字.数字.数字（例如 1.0.0）。"
            exit 1
          fi

          # 发布版本与构建文件里的版本号必须同源，否则产物文件名与 App「关于」页显示的会对不上
          if [ "$SKIP_CHECK" != "true" ]; then
            ANDROID_V="$(grep -oE 'versionName = "[0-9][0-9.]*"' androidApp/build.gradle.kts | head -1 | sed 's/.*"\([^"]*\)"/\1/')"
            DESKTOP_V="$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' desktopApp/build.gradle.kts | tail -1 | tr -d '"')"

            if [ "$V" != "$ANDROID_V" ]; then
              echo "::error::版本不一致 - 本次要发 $V，但 androidApp/build.gradle.kts 的 versionName 是 $ANDROID_V"
              echo "::error::请把 versionName 改成 $V（同时按规则递增 versionCode）后重新打 tag；紧急发版可勾选 skip_version_check 跳过。"
              exit 1
            fi
            if [ -n "$DESKTOP_V" ] && [ "$V" != "$DESKTOP_V" ]; then
              echo "::error::版本不一致 - 本次要发 $V，但 desktopApp/build.gradle.kts 的兜底版本是 $DESKTOP_V。两处必须一致。"
              exit 1
            fi
          fi

          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "is_tag_push=$IS_TAG" >> "$GITHUB_OUTPUT"

          {
            echo "### 版本解析"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 发布版本 | \`$V\` |"
            echo "| 关联 tag | \`v$V\` |"
            echo "| 内置引擎 | \`$FRP_VERSION\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================ 桌面端四平台
  desktop:
    name: Desktop ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # 走 desktopApp/build.gradle.kts 的 appVersionRaw，同步写进 resources/VERSION
      APP_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
          - name: macos-arm64
            os: macos-15
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          # frp 源码是构建期下载的，仓库里没有 go.mod，setup-go 自带的依赖缓存用不上，
          # 下面改用 actions/cache 按 FRP_VERSION 显式缓存 GOCACHE / GOMODCACHE
          cache: false

      - name: Resolve Go cache paths
        id: gopaths
        shell: bash
        run: |
          set -euo pipefail
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ env.FRP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-

      # frp 源码按版本只下一份，四个平台 job 复用（脚本命中缓存后不再走网络）
      - name: Cache frp source
        uses: actions/cache@v4
        with:
          path: .build/frpc-engine/src
          key: frp-src-${{ env.FRP_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build frpc engine
        shell: bash
        run: bash scripts/build-frpc.sh desktop

      - name: Verify engine
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="desktopApp/engine/frpc.exe"
          else
            BIN="desktopApp/engine/frpc"
          fi
          if [ ! -f "$BIN" ]; then
            echo "::error::引擎未生成 - $BIN。请检查上一步 scripts/build-frpc.sh 的输出。"
            exit 1
          fi
          echo "engine ok - $BIN ($(wc -c < "$BIN") bytes)"

      - name: Install WiX Toolset
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($wix) { "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw "WiX 安装后仍找不到 candle.exe，jpackage 无法生成 .exe 安装程序。请检查本步骤的 choco 输出。"
          }
          Write-Host "WiX ok - $((Get-Command candle.exe).Source)"

      - name: Unit tests
        shell: bash
        run: ./gradlew --no-daemon :shared:jvmTest --console=plain

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            windows-x64)
              # 便携版（app-image，自带 JRE）+ 安装程序
              ./gradlew --no-daemon :desktopApp:createDistributable --console=plain
              ./gradlew --no-daemon :desktopApp:packageExe --console=plain
              ;;
            linux-x64)
              ./gradlew --no-daemon :desktopApp:createDistributable --console=plain
              ./gradlew --no-daemon :desktopApp:packageDeb --console=plain
              ;;
            macos-*)
              # 明确只出 dmg：packageDistributionForCurrentOS 会连带其它格式，
              # 且 CMP 在 macOS 上无法执行 packageAppImage
              ./gradlew --no-daemon :desktopApp:createDistributable --console=plain
              ./gradlew --no-daemon :desktopApp:packageDmg --console=plain
              ;;
          esac

      # AppImage 依赖 runner 上的 fuse，时好时坏，失败不阻塞发版
      - name: Package AppImage
        if: matrix.name == 'linux-x64'
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon :desktopApp:packageAppImage --console=plain

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          A="${{ matrix.arch }}"
          BIN="desktopApp/build/compose/binaries/main"
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"
          MISSING=0

          # 找不到就记一笔并置失败标记，最后统一报错 —— 比逐个 exit 1 更能一次看清缺了什么
          take() { # <目录> <glob> <目标文件名>
            local f
            f="$(find "$1" -maxdepth 1 -name "$2" -print -quit 2>/dev/null || true)"
            if [ -n "$f" ]; then
              mv "$f" "$OUT/$3"
              echo "  + $3"
            else
              echo "::error::缺少产物 - 在 $1 下未找到 $2"
              MISSING=1
            fi
          }
          take_opt() { # <目录> <glob> <目标文件名>
            local f
            f="$(find "$1" -maxdepth 1 -name "$2" -print -quit 2>/dev/null || true)"
            if [ -n "$f" ]; then mv "$f" "$OUT/$3"; echo "  + $3"
            else echo "  - 未生成 $3（可选，不阻塞发版）"; fi
          }

          case "${{ matrix.name }}" in
            windows-x64)
              if [ -d "$BIN/app/$PRODUCT" ]; then
                powershell -NoProfile -Command "Compress-Archive -Path '$BIN/app/$PRODUCT' -DestinationPath '$OUT/$PRODUCT-$V-windows-x64.zip' -Force"
                echo "  + $PRODUCT-$V-windows-x64.zip"
              else
                echo "::error::缺少产物 - Windows app-image 目录 $BIN/app/$PRODUCT"
                MISSING=1
              fi
              take "$BIN/exe" '*.exe' "$PRODUCT-$V-windows-x64-setup.exe"
              ;;
            linux-x64)
              if [ -d "$BIN/app/$PRODUCT" ]; then
                tar -czf "$OUT/$PRODUCT-$V-linux-x64.tar.gz" -C "$BIN/app" "$PRODUCT"
                echo "  + $PRODUCT-$V-linux-x64.tar.gz"
              else
                echo "::error::缺少产物 - Linux app-image 目录 $BIN/app/$PRODUCT"
                MISSING=1
              fi
              take "$BIN/deb" '*.deb' "$PRODUCT-$V-linux-x64.deb"
              take_opt "$BIN/app-image" '*.AppImage' "$PRODUCT-$V-linux-x64.AppImage"
              ;;
            macos-*)
              take "$BIN/dmg" '*.dmg' "$PRODUCT-$V-macos-$A.dmg"
              if [ -d "$BIN/app/$PRODUCT.app" ]; then
                tar -czf "$OUT/$PRODUCT-$V-macos-$A.tar.gz" -C "$BIN/app" "$PRODUCT.app"
                echo "  + $PRODUCT-$V-macos-$A.tar.gz"
              else
                echo "::error::缺少产物 - macOS app bundle 目录 $BIN/app/$PRODUCT.app"
                MISSING=1
              fi
              ;;
          esac

          take "desktopApp/engine" "VERSION" "frpc-engine-VERSION.txt"

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "::error::${{ matrix.name }} 缺少必需产物，已终止。上方逐项列出了缺失内容及期望路径。"
            exit 1
          fi

          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in "$OUT"/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # ================================================================ Android
  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Resolve Go cache paths
        id: gopaths
        shell: bash
        run: |
          set -euo pipefail
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ env.FRP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Cache frp source
        uses: actions/cache@v4
        with:
          path: .build/frpc-engine/src
          key: frp-src-${{ env.FRP_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build frpc engine
        env:
          SKIP_X86_64: '1'
        run: bash scripts/build-frpc.sh android

      - name: Verify engine is a valid AArch64 ELF
        run: |
          set -euo pipefail
          SO=androidApp/src/main/jniLibs/arm64-v8a/libfrpc.so
          [ -f "$SO" ] || { echo "::error::未生成 $SO"; exit 1; }
          python3 - "$SO" <<'PY'
          import sys
          data = open(sys.argv[1], 'rb').read(20)
          assert data[:4] == b'\x7fELF', 'not an ELF binary'
          assert data[4] == 2, 'not ELF64'
          assert int.from_bytes(data[18:20], 'little') == 0xB7, 'not AArch64'
          print('OK: ELF64 AArch64')
          PY

      - name: Check signing secret
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置仓库 secret KEYSTORE_BASE64，产物将是未签名 APK（无法直接安装到手机）"
          fi

      - name: Decode keystore
        if: steps.ks.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :shared:jvmTest :shared:testDebugUnitTest :androidApp:testDebugUnitTest

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :androidApp:assembleRelease --console=plain

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          OUT="$GITHUB_WORKSPACE/dist"
          DIR="androidApp/build/outputs/apk/release"
          mkdir -p "$OUT"

          # 签名时输出 androidApp-release.apk，未签名时是 androidApp-release-unsigned.apk
          if [ -f "$DIR/androidApp-release.apk" ]; then
            cp "$DIR/androidApp-release.apk" "$OUT/$PRODUCT-$V-android-arm64.apk"
            SIGNED=yes
          elif [ -f "$DIR/androidApp-release-unsigned.apk" ]; then
            # 未签名 APK 装不上手机，默认视为不合格产物直接终止，避免悄悄发出去
            if [ "${{ github.event.inputs.allow_unsigned_apk }}" != "true" ]; then
              echo "::error::产出未签名 APK，签名未生效。未签名 APK 无法安装到手机，已终止本 job。"
              echo "::error::请核对仓库 4 个 secret：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 是否齐全且互相匹配。"
              echo "::error::确需放行请用 workflow_dispatch 触发并勾选 allow_unsigned_apk。"
              exit 1
            fi
            cp "$DIR/androidApp-release-unsigned.apk" "$OUT/$PRODUCT-$V-android-arm64-unsigned.apk"
            SIGNED=no
            echo "::warning::已按输入放行未签名 APK，该产物无法通过普通方式安装到手机。"
          else
            echo "::error::未找到 release APK。$DIR 实际内容如下："
            ls -la "$DIR"
            exit 1
          fi

          cp androidApp/src/main/assets/frpc/VERSION "$OUT/frpc-engine-VERSION.txt"

          {
            echo "### Android"
            echo ""
            echo "| 文件 | 大小 | 签名 |"
            echo "|---|---|---|"
            for f in "$OUT"/*; do
              [ "$(basename "$f")" = "frpc-engine-VERSION.txt" ] && continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | $SIGNED |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  # ================================================================ 发布
  release:
    name: Publish release
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          cd dist
          MISSING=0
          check() { # <文件名> <required|optional>
            if [ -f "$1" ]; then
              printf '  [OK]      %-46s %s\n' "$1" "$(du -h "$1" | cut -f1)"
            elif [ "$2" = required ]; then
              printf '  [MISSING] %-46s %s\n' "$1" "-"
              MISSING=$((MISSING+1))
            else
              printf '  [skip]    %-46s %s\n' "$1" "可选，未生成"
            fi
          }

          echo "== 必需产物 =="
          check "frpc-desktop-multi-$V-windows-x64.zip"        required
          check "frpc-desktop-multi-$V-windows-x64-setup.exe"  required
          check "frpc-desktop-multi-$V-linux-x64.tar.gz"       required
          check "frpc-desktop-multi-$V-linux-x64.deb"          required
          check "frpc-desktop-multi-$V-macos-arm64.dmg"        required
          check "frpc-desktop-multi-$V-macos-arm64.tar.gz"     required
          check "frpc-desktop-multi-$V-macos-x64.dmg"          required
          check "frpc-desktop-multi-$V-macos-x64.tar.gz"       required
          check "frpc-engine-VERSION.txt"            required
          # Android 签名与否决定文件名，两者任一存在即可
          if [ -f "frpc-desktop-multi-$V-android-arm64.apk" ]; then
            check "frpc-desktop-multi-$V-android-arm64.apk" required
          else
            check "frpc-desktop-multi-$V-android-arm64-unsigned.apk" required
          fi

          echo "== 可选产物 =="
          check "frpc-desktop-multi-$V-linux-x64.AppImage" optional

          echo "== 多余文件（正常应为空） =="
          for f in *; do
            case "$f" in
              frpc-desktop-multi-$V-windows-x64.zip|frpc-desktop-multi-$V-windows-x64-setup.exe|\
              frpc-desktop-multi-$V-linux-x64.tar.gz|frpc-desktop-multi-$V-linux-x64.deb|frpc-desktop-multi-$V-linux-x64.AppImage|\
              frpc-desktop-multi-$V-macos-arm64.dmg|frpc-desktop-multi-$V-macos-arm64.tar.gz|\
              frpc-desktop-multi-$V-macos-x64.dmg|frpc-desktop-multi-$V-macos-x64.tar.gz|\
              frpc-desktop-multi-$V-android-arm64.apk|frpc-desktop-multi-$V-android-arm64-unsigned.apk|\
              frpc-engine-VERSION.txt) ;;
              *) echo "  [UNEXPECTED] $f" ;;
            esac
          done

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "::error::缺少 $MISSING 个必需产物，已终止发布，Release 不会被更新。"
            echo "::error::请到上方各 job 的「Collect artifacts」步骤查看，缺失项都带期望路径。"
            exit 1
          fi
          echo ""
          echo "全部必需产物齐备，准备发布。"

      - name: Create tag
        if: needs.version.outputs.is_tag_push != 'true'
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在于远程，跳过创建"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "已创建并推送 tag $TAG（指向 $(git rev-parse --short HEAD)）"
          fi

      - name: Create or update release
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          TAG="v$V"
          FRP="$(tr -d '[:space:]' < dist/frpc-engine-VERSION.txt 2>/dev/null || true)"
          [ -n "${FRP:-}" ] || FRP="$FRP_VERSION"

          {
            echo "## frpc-desktop-multi $V"
            echo ""
            echo "frp 客户端一体化发布：**桌面端 + Android**，共用同一套配置模型与校验逻辑。"
            echo "内置 frpc 引擎：**$FRP**（各平台独立原生编译，非跨平台模拟）"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "|---|---|---|"
            echo "| Windows x64 | \`frpc-desktop-multi-$V-windows-x64-setup.exe\` | 双击安装，自带 JRE，含开始菜单快捷方式 |"
            echo "| Windows x64 | \`frpc-desktop-multi-$V-windows-x64.zip\` | 便携版，解压后运行 \`frpc-desktop-multi.exe\` |"
            echo "| Linux x64 | \`frpc-desktop-multi-$V-linux-x64.tar.gz\` / \`.deb\` | 解压运行 \`bin/frpc-desktop-multi\`，或 \`dpkg -i\` |"
            echo "| macOS arm64 | \`frpc-desktop-multi-$V-macos-arm64.dmg\` | Apple Silicon；未签名，首次需右键打开 |"
            echo "| macOS x64 | \`frpc-desktop-multi-$V-macos-x64.dmg\` | Intel；未签名，首次需右键打开 |"
            echo "| Android arm64 | \`frpc-desktop-multi-$V-android-arm64.apk\` | Android 8.0+，允许未知来源安装 |"
            echo ""
            echo "macOS 的 \`.tar.gz\` 是同一个 \`.app\` 的压缩包（不便挂载 DMG 时用）。"
            echo ""
            echo "已验证协议：tcp / udp / http / https / stcp / xtcp / tcpmux / sudp（CI 真跑 frps+frpc 建隧道校验）。"
            echo ""
            echo "桌面端数据目录 \`~/.frpcdash/\`（首次启动自动迁移旧 \`~/.frpc-desktop/\` 配置）。"
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
            echo "已更新已存在的 Release $TAG"
          else
            gh release create "$TAG" dist/* --title "frpc-desktop-multi $V" --notes-file notes.md
            echo "已创建 Release $TAG"
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Release ${{ needs.version.outputs.tag }}"
            echo ""
            echo "https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================ 汇总（失败时也能给出结论）
  summary:
    name: Build summary
    if: always()
    needs: [version, desktop, android, release]
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os

          needs = json.loads(os.environ["NEEDS_JSON"])
          label = {"success": "OK", "failure": "FAILED", "cancelled": "CANCELLED", "skipped": "SKIPPED"}
          rows, failed = [], []
          for name, info in needs.items():
              r = info.get("result", "unknown")
              rows.append((name, label.get(r, r.upper())))
              if r in ("failure", "cancelled"):
                  failed.append(name)

          out = ["## 构建汇总", "", "| Job | 结果 |", "|---|---|"]
          out += [f"| `{n}` | {r} |" for n, r in rows]
          out.append("")
          if failed:
              out.append("**失败环节：** " + ", ".join(f"`{x}`" for x in failed))
              out.append("")
              out.append("未生成 Release。请点开对应 job，查看红色 `::error::` 注解定位原因。")
          else:
              out.append("全部通过，Release 已发布。")

          text = "\n".join(out) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text)

          if failed:
              print("::error::以下 job 未通过 -> " + ", ".join(failed) + "（Release 未发布）")
              raise SystemExit(1)
          PY
