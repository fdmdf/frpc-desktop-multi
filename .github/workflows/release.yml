name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 2.0.1），留空用 2.0.0'
        required: false

permissions:
  contents: write

env:
  FRP_VERSION: v0.71.1

jobs:
  # ---------------------------------------------------------------- 桌面端三平台
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs-on: windows-latest
          - name: linux-x64
            runs-on: ubuntu-latest
          - name: macos-arm64
            runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
            [ -n "${V:-}" ] || V="2.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "resolved: $V"

      # 引擎按 runner 当前平台/架构编译（自带 JRE 的 app-image 也随之平台化）
      - name: Build frpc engine
        shell: bash
        run: bash scripts/build-frpc.sh desktop

      - name: Unit tests
        shell: bash
        run: ./gradlew --no-daemon :shared:jvmTest --console=plain

      - name: Install WiX Toolset (Windows .exe installer)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($wix) { "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Package distribution
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "windows-x64" ]; then
            # 便携版（解压即用）+ jpackage 安装程序（直接双击安装，生成 .exe）
            ./gradlew --no-daemon :desktopApp:createDistributable --console=plain
            ./gradlew --no-daemon :desktopApp:packageExe --console=plain
          elif [ "${{ matrix.name }}" = "macos-arm64" ]; then
            # 明确只出 dmg，避免 packageDistributionForCurrentOS 连带其它格式
            ./gradlew --no-daemon :desktopApp:packageDmg --console=plain
          else
            ./gradlew --no-daemon :desktopApp:packageDistributionForCurrentOS --console=plain
          fi

      # AppImage 依赖 runner 环境（appimagetool/fuse），失败不影响发版
      - name: Package AppImage (optional)
        if: matrix.name == 'linux-x64'
        continue-on-error: true
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: ./gradlew --no-daemon :desktopApp:packageAppImage --console=plain

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          OUT="$GITHUB_WORKSPACE/dist"
          BIN="desktopApp/build/compose/binaries/main"
          mkdir -p "$OUT"

          # CMP 各格式输出目录不同（app/、dmg/、deb/、app-image/），统一用 find 找
          take() { # <glob> <目标文件名>
            local f
            f="$(find "$BIN" -maxdepth 2 -name "$1" -print -quit)"
            if [ -n "$f" ]; then cp "$f" "$OUT/$2"; echo "  + $2"; else echo "  - 未生成 $1"; fi
          }

          if [ "${{ matrix.name }}" = "windows-x64" ]; then
            # 自带 JRE 的应用镜像：解压即用，免安装 JDK
            powershell -NoProfile -Command "Compress-Archive -Path '$BIN/app/FrpcDash' -DestinationPath '$OUT/FrpcDash-$V-windows-x64.zip' -Force"
            echo "  + FrpcDash-$V-windows-x64.zip"
            # jpackage 生成的安装程序（双击安装，开始菜单快捷方式）
            INST="$(find "$BIN/exe" -maxdepth 1 -name '*.exe' -print -quit 2>/dev/null || true)"
            if [ -n "$INST" ]; then
              cp "$INST" "$OUT/FrpcDash-$V-windows-x64-setup.exe"
              echo "  + FrpcDash-$V-windows-x64-setup.exe"
            else
              echo "  - 未生成 Windows 安装程序"
            fi
          elif [ "${{ matrix.name }}" = "linux-x64" ]; then
            tar -czf "$OUT/FrpcDash-$V-linux-x64.tar.gz" -C "$BIN/app" FrpcDash
            echo "  + FrpcDash-$V-linux-x64.tar.gz"
            take '*.deb' "FrpcDash-$V-linux-x64.deb"
            take '*.AppImage' "FrpcDash-$V-linux-x64.AppImage"
          else
            take '*.dmg' "FrpcDash-$V-macos-arm64.dmg"
            tar -czf "$OUT/FrpcDash-$V-macos-arm64.tar.gz" -C "$BIN/app" FrpcDash.app
            echo "  + FrpcDash-$V-macos-arm64.tar.gz"
          fi
          cp desktopApp/engine/VERSION "$OUT/frpc-engine-VERSION.txt"
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: warn

  # ---------------------------------------------------------------- Android
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - uses: gradle/actions/setup-gradle@v4

      - name: Build frpc engine (android/arm64)
        env:
          SKIP_X86_64: '1'
        run: bash scripts/build-frpc.sh android

      - name: Check signing secret
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，APK 将不签名（无法直接安装）"
          fi

      - name: Decode keystore
        if: steps.ks.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :shared:jvmTest :shared:testDebugUnitTest :androidApp:testDebugUnitTest

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Collect artifacts
        run: |
          set -euo pipefail
          V="$(grep -oE 'versionName = "[^"]+"' androidApp/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"
          SRC="$(ls androidApp/build/outputs/apk/release/*.apk | head -1)"
          cp "$SRC" "$OUT/FrpcDash-$V-android-arm64.apk"
          cp androidApp/src/main/assets/frpc/VERSION "$OUT/frpc-engine-VERSION.txt"
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  release:
    name: Publish release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            V="${{ github.event.inputs.version }}"; [ -n "${V:-}" ] || V="2.0.0"
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          FRP="$(cat dist/frpc-engine-VERSION.txt 2>/dev/null | tr -d '[:space:]')"
          [ -n "${FRP:-}" ] || FRP="$FRP_VERSION"
          TAG="v$V"
          cat > notes.md <<EOF
          ## FrpcDash $V

          frp 客户端一体化发布：**桌面端 + Android**，共用同一套配置模型与校验逻辑。
          内置 frpc 引擎：**$FRP**（四平台各自原生编译，非跨平台模拟）

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | Windows x64 | \`FrpcDash-$V-windows-x64-setup.exe\` | 双击安装（自带 JRE，含开始菜单快捷方式） |
          | Windows x64 | \`FrpcDash-$V-windows-x64.zip\` | 便携版，解压后运行 \`FrpcDash.exe\` |
          | Linux x64 | \`FrpcDash-$V-linux-x64.tar.gz\` / \`.deb\` | tar 解压运行，或 \`dpkg -i\` |
          | macOS arm64 | \`FrpcDash-$V-macos-arm64.dmg\` / \`.tar.gz\` | Apple Silicon；未签名，首次需右键打开 |
          | Android arm64 | \`FrpcDash-$V-android-arm64.apk\` | Android 8.0+，允许未知来源安装 |

          已验证协议：tcp / udp / http / https / stcp / xtcp / tcpmux / sudp（CI 真跑 frps+frpc 建隧道校验）。

          桌面端数据目录 \`~/.frpcdash/\`（首次启动自动迁移旧 \`~/.frpc-desktop/\` 配置）。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "FrpcDash $V" --notes-file notes.md
          fi
