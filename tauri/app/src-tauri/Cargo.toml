[package]
name = "frpc-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fdmdf/frpc-desktop-multi"
description = "Frpc-Android-Multi · Tauri 2 应用壳（桌面 + Android）"

[lib]
name = "frpc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
frpc-core = { path = "../../crates/frpc-core" }
